		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #0b1a12;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>

<script>(function(){var K='fr_weblog';function log(m){try{var a=JSON.parse(localStorage.getItem(K)||'[]');a.push(new Date().toISOString().slice(11,19)+' '+m);while(a.length>120)a.shift();localStorage.setItem(K,JSON.stringify(a))}catch(e){}}window.frLog=log;var top=false;try{top=window.top===window||!!window.top.location.href}catch(e){top=false}window.frTop=top;var dW=Object.getOwnPropertyDescriptor(window,'innerWidth'),dH=Object.getOwnPropertyDescriptor(window,'innerHeight');var lastW=dW.get.call(window),lastH=dH.get.call(window),held=false;function real(){return[dW.get.call(window),dH.get.call(window)]}Object.defineProperty(window,'innerWidth',{configurable:true,get:function(){var v=dW.get.call(window);if(v>0){lastW=v;return v}return lastW||v}});Object.defineProperty(window,'innerHeight',{configurable:true,get:function(){var v=dH.get.call(window);if(v>0){lastH=v;return v}return lastH||v}});var gl=null;function lost(){try{var c=document.getElementById('canvas');gl=gl||(c&&c.getContext('webgl2'));return gl?(gl.isContextLost()?' LOST':' ok'):' nogl'}catch(e){return' ?'}}log('boot '+real().join('x')+(top?' top':' framed'));if(top&&navigator.storage&&navigator.storage.persist){navigator.storage.persist().then(function(p){log('persist '+(p?'granted':'denied'))}).catch(function(){})}document.addEventListener('visibilitychange',function(){log('vis '+document.visibilityState+lost())});document.addEventListener('fullscreenchange',function(){log('fs '+(document.fullscreenElement?'in':'out'))});var rt;addEventListener('resize',function(){var r=real();var h=r[1]===0||r[0]===0;if(h!==held){held=h;log(h?'guard holding '+lastW+'x'+lastH:'guard released')}clearTimeout(rt);rt=setTimeout(function(){log('resize '+real().join('x')+lost())},200)});var lt=0;addEventListener('pointerdown',function(){var n=Date.now();if(n-lt>3000){lt=n;log('touch')}},true);addEventListener('pagehide',function(e){log('pagehide'+(e.persisted?' persisted':''))});addEventListener('pageshow',function(e){if(e.persisted)log('pageshow persisted')});addEventListener('DOMContentLoaded',function(){var c=document.getElementById('canvas');c.addEventListener('webglcontextlost',function(ev){log('ctxlost');ev.stopImmediatePropagation();dispatchEvent(new Event('flushrush-context-lost'))});c.addEventListener('webglcontextrestored',function(){log('ctxrestored')})})})()</script>

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":989952,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
